name: Deploy MR Panel4

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # 1. Deploy EventBus Durable Object Worker
      - name: Deploy EventBus Worker
        working-directory: artifacts/event-bus-worker
        run: npx wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # 2. Build React SPA + CF Worker bundle
      - name: Build Dashboard
        run: pnpm --filter @workspace/dashboard run build

      # 3. Create the separate Pages project if it does not already exist
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          projects="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api_url}")"
          if ! jq -e '.success == true' <<<"${projects}" >/dev/null; then
            echo "Could not verify Cloudflare Pages projects." >&2
            exit 1
          fi
          if jq -e --arg name "mr-panel5" 'any(.result[]?; .name == $name)' <<<"${projects}" >/dev/null; then
            echo "Cloudflare Pages project mr-panel5 is ready."
          else
            payload="$(jq -cn --arg name "mr-panel5" --arg branch "main" '{name: $name, production_branch: $branch}')"
            created="$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "${payload}" "${api_url}")"
            if ! jq -e '.success == true' <<<"${created}" >/dev/null; then
              echo "Could not create Cloudflare Pages project mr-panel5." >&2
              exit 1
            fi
            echo "Created Cloudflare Pages project mr-panel5."
          fi

      # Add the missing login-attempts table without deleting or replacing existing data.
      - name: Ensure required master panel schema and check database
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_DATABASE_URL}" ]; then
            echo "NEON_DATABASE_URL GitHub secret is missing." >&2
            exit 1
          fi
          pnpm --filter @workspace/dashboard exec node --input-type=module <<'NODE'
          import { neon } from "@neondatabase/serverless";
          try {
            const sql = neon(process.env.NEON_DATABASE_URL);
            await sql("SELECT 1 AS ok");
            const columnsBefore = await sql("SELECT table_name, column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name IN ('apps', 'app_secrets', 'app_panel_tokens', 'admin_sessions') ORDER BY table_name, ordinal_position");
            console.log('Master panel schema before setup:', JSON.stringify(columnsBefore));
            const legacyAppColumns = new Set(columnsBefore.filter(row => row.table_name === 'apps').map(row => row.column_name));
            await sql("CREATE TABLE IF NOT EXISTS app_secrets (app_id TEXT PRIMARY KEY, pin TEXT NOT NULL, delete_protection_pin TEXT, delete_protection_enabled BOOLEAN NOT NULL DEFAULT FALSE, login_limit INTEGER NOT NULL DEFAULT 20)");
            await sql("CREATE TABLE IF NOT EXISTS app_panel_tokens (app_id TEXT PRIMARY KEY, panel_token TEXT)");
            await sql("CREATE TABLE IF NOT EXISTS admin_sessions (id TEXT PRIMARY KEY, login_time TIMESTAMPTZ NOT NULL DEFAULT NOW(), last_active TIMESTAMPTZ NOT NULL DEFAULT NOW(), user_agent TEXT NOT NULL DEFAULT '', ip TEXT NOT NULL DEFAULT '', device TEXT NOT NULL DEFAULT '', app_id TEXT NOT NULL DEFAULT '')");
            await sql("ALTER TABLE app_secrets ADD COLUMN IF NOT EXISTS delete_protection_pin TEXT");
            await sql("ALTER TABLE app_secrets ADD COLUMN IF NOT EXISTS delete_protection_enabled BOOLEAN NOT NULL DEFAULT FALSE");
            await sql("ALTER TABLE app_secrets ADD COLUMN IF NOT EXISTS login_limit INTEGER NOT NULL DEFAULT 20");
            await sql("ALTER TABLE app_panel_tokens ADD COLUMN IF NOT EXISTS panel_token TEXT");
            await sql("ALTER TABLE admin_sessions ADD COLUMN IF NOT EXISTS app_id TEXT NOT NULL DEFAULT ''");
            await sql("ALTER TABLE admin_sessions ADD COLUMN IF NOT EXISTS last_active TIMESTAMPTZ NOT NULL DEFAULT NOW()");
            await sql("ALTER TABLE apps ADD COLUMN IF NOT EXISTS created_at TIMESTAMPTZ DEFAULT NOW()");
            if (legacyAppColumns.has('pin')) {
              const protectionPin = legacyAppColumns.has('delete_protection_pin') ? 'delete_protection_pin' : 'NULL';
              const protectionEnabled = legacyAppColumns.has('delete_protection_enabled') ? 'COALESCE(delete_protection_enabled, FALSE)' : 'FALSE';
              const loginLimit = legacyAppColumns.has('login_limit') ? 'COALESCE(login_limit, 20)' : '20';
              await sql('INSERT INTO app_secrets (app_id, pin, delete_protection_pin, delete_protection_enabled, login_limit) SELECT app_id, pin, ' + protectionPin + ', ' + protectionEnabled + ', ' + loginLimit + ' FROM apps WHERE pin IS NOT NULL ON CONFLICT (app_id) DO NOTHING');
            }
            if (legacyAppColumns.has('panel_token')) await sql('INSERT INTO app_panel_tokens (app_id, panel_token) SELECT app_id, panel_token FROM apps WHERE panel_token IS NOT NULL ON CONFLICT (app_id) DO NOTHING');
            await sql('SELECT id, app_id, name, status, created_at FROM apps ORDER BY created_at DESC LIMIT 0');
            await sql('SELECT app_id, pin, delete_protection_pin, delete_protection_enabled, login_limit FROM app_secrets LIMIT 0');
            await sql('SELECT app_id, panel_token FROM app_panel_tokens LIMIT 0');
            await sql("SELECT app_id, COUNT(*) AS cnt FROM admin_sessions WHERE last_active > NOW() - INTERVAL '1 hour' GROUP BY app_id");
            console.log('Master apps database queries: OK. Existing rows and legacy fields preserved.');
            await sql("CREATE TABLE IF NOT EXISTS master_login_attempts (ip TEXT PRIMARY KEY, failed_count INTEGER NOT NULL DEFAULT 0, last_attempt TIMESTAMPTZ NOT NULL DEFAULT NOW(), locked_until TIMESTAMPTZ)");
            const rows = await sql("SELECT to_regclass('public.settings') IS NOT NULL AS settings, to_regclass('public.master_login_attempts') IS NOT NULL AS master_login_attempts, to_regclass('public.master_sessions') IS NOT NULL AS master_sessions");
            console.log("Neon connection: OK. Auth tables:", JSON.stringify(rows[0]));
            const pinStatus = await sql("SELECT EXISTS (SELECT 1 FROM settings WHERE key = 'master_pin' AND value <> '') AS configured");
            console.log("Master PIN configured:", pinStatus[0].configured);
          } catch {
            console.error("Neon connection or auth table setup failed. Check the saved NEON_DATABASE_URL secret and database availability; credentials are not logged.");
            process.exit(1);
          }
          NODE

      # GitHub Actions secrets are not automatically available to Pages Functions.
      - name: Sync database secret to Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          printf '%s' "${NEON_DATABASE_URL}" | npx wrangler@3 pages secret put NEON_DATABASE_URL --project-name=mr-panel5
          node --input-type=module <<'NODE'
          try {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/mr-panel5`, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error("Could not verify Pages configuration");
            const vars = result.result.deployment_configs.production.env_vars ?? {};
            for (const signingKey of ["JWT_SECRET", "API_SECRET"]) {
              if (vars[signingKey]) continue;
              const { randomBytes } = await import("node:crypto");
              const signingSecret = randomBytes(48).toString("base64url");
              const saved = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/mr-panel5`, {
                method: "PATCH",
                headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ deployment_configs: { production: { env_vars: { [signingKey]: { type: "secret_text", value: signingSecret } }, wrangler_config_hash: result.result.deployment_configs.production.wrangler_config_hash } } })
              });
              const savedResult = await saved.json();
              if (!saved.ok || !savedResult.success) throw new Error("Signing secret setup failed");
              vars[signingKey] = { type: "secret_text" };
              console.log(signingKey + " signing secret created; existing bindings preserved.");
            }
            console.log("Pages production binding presence:", JSON.stringify({ NEON_DATABASE_URL: Boolean(vars.NEON_DATABASE_URL), JWT_SECRET: Boolean(vars.JWT_SECRET), API_SECRET: Boolean(vars.API_SECRET), FIREBASE_SERVICE_ACCOUNT_JSON: Boolean(vars.FIREBASE_SERVICE_ACCOUNT_JSON) }));
          } catch {
            console.error("Pages configuration verification failed; credentials are not logged.");
            process.exit(1);
          }
          NODE

      # Validate credentials and FCM permissions without delivering any message.
      - name: Validate Firebase service account and FCM permission
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { sign } from 'node:crypto';
          let stage = 'JSON and private-key validation';
          try {
            const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '{}');
            if (credentials.type !== 'service_account' || typeof credentials.project_id !== 'string' || !/^[A-Za-z0-9:_-]+$/.test(credentials.project_id) || typeof credentials.client_email !== 'string' || typeof credentials.private_key !== 'string') throw new Error('Invalid credential shape');
            const key = credentials.private_key.trim().replace(/\\n/g, '\n');
            const now = Math.floor(Date.now() / 1000);
            const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
            const unsigned = encode({ alg: 'RS256', typ: 'JWT' }) + '.' + encode({ iss: credentials.client_email, scope: 'https://www.googleapis.com/auth/firebase.messaging', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600 });
            const assertion = unsigned + '.' + sign('RSA-SHA256', Buffer.from(unsigned), key).toString('base64url');
            console.log('Firebase service account JSON and signing key: valid.');
            stage = 'Google OAuth authentication';
            const oauth = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion }) });
            if (!oauth.ok) { console.error('Google OAuth verification failed. HTTP status:', oauth.status); process.exit(1); }
            const token = await oauth.json();
            if (!token.access_token) throw new Error('No access token');
            console.log('Google OAuth authentication: OK.');
            stage = 'FCM validation-only permission check';
            const check = await fetch('https://fcm.googleapis.com/v1/projects/' + encodeURIComponent(credentials.project_id) + '/messages:send', { method: 'POST', headers: { Authorization: 'Bearer ' + token.access_token, 'Content-Type': 'application/json' }, body: JSON.stringify({ validate_only: true, message: { topic: 'mr-panel5-config-check', data: { check: 'configuration-validation-only' } } }) });
            if (!check.ok) { const error = await check.json().catch(() => ({})); const code = /^[A-Z_]+$/.test(error.error?.status || '') ? error.error.status : 'UNSPECIFIED'; console.error('FCM validation-only check failed. HTTP status:', check.status, 'Code:', code); process.exit(1); }
            console.log('FCM validate_only: HTTP 200. No notification delivered.');
          } catch {
            console.error('Firebase configuration check failed at:', stage, '- credential values are not logged.');
            process.exit(1);
          }
          NODE

      - name: Sync Firebase service account to Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" | npx wrangler@3 pages secret put FIREBASE_SERVICE_ACCOUNT_JSON --project-name=mr-panel5

      # 4. Deploy the dashboard to its own Pages project
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy artifacts/dashboard/dist/public --project-name=mr-panel5 --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
